name: Full Link Check

on:
  schedule:
    - cron: "0 13 * * 1" # Monday mornings
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - name: Run full link sweep
        id: check
        run: node scripts/check-links.mjs 2>&1 | tee link-check-output.txt
        continue-on-error: true

      - name: Open an issue if any sources are dead
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Weekly link check: dead source URL(s) found" \
            --body-file link-check-output.txt \
            --label "data-integrity"
